<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f6f8;
            color: #555;
            flex-direction: column;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #message {
            text-align: center;
            max-width: 80%;
        }

        .config-error {
            color: #d9534f;
            background: #f9f2f4;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #d9534f;
        }
    </style>

</head>

<body>

    <div class="loader" id="loader"></div>
    <div id="message">Processing...</div>

    <script>
        // ==========================================
        // CONFIGURATION SECTION - EDIT THIS!
        // ==========================================
        const CONFIG = {
            // Paste your Google Apps Script Web App URL here
            // Example: "https://script.google.com/macros/s/AKfycby.../exec"
            WEB_APP_URL: "https://script.google.com/macros/s/AKfycbygcvjOD3FDGHUGQAg0uHSmpS7miE39u3kSdLL_Pz_CiRv5EsAmZi6bP5w5E1MzbNVz/exec",
            // LINE Developers > LINE Login channel > LIFF. Leave empty for anonymous tracking.
            LIFF_ID: "2006670422-dTReuVpo"
        };
        // ==========================================

        async function init() {
            const msgEl = document.getElementById('message');
            const loaderEl = document.getElementById('loader');
            if (!CONFIG.WEB_APP_URL) {
                loaderEl.style.display = 'none';
                msgEl.textContent = 'System not configured: WEB_APP_URL is missing.';
                return;
            }

            // Preserve only the tracking ID. Never save OAuth URLs or credentials.
            const initialId = getTrackingId(window.location.search);
            let idToken = '';
            let lineClientStatus = 'disabled';
            let analyticsReady = !CONFIG.LIFF_ID;
            if (CONFIG.LIFF_ID) {
                let stage = 'sdk_unavailable';
                try {
                    msgEl.textContent = 'Connecting to LINE...';
                    await loadLiff();
                    stage = 'init_failed';
                    await liff.init({ liffId: CONFIG.LIFF_ID });
                    stage = 'session_failed';
                    const id = getTrackingId(window.location.search) || initialId;
                    if (!id) {
                        loaderEl.style.display = 'none';
                        msgEl.textContent = 'Link ID not found.';
                        return;
                    }
                    if (!liff.isLoggedIn()) {
                        // Login is automatic inside LIFF; manual login is for other browsers.
                        if (!liff.isInClient()) {
                            const redirectUrl = new URL(window.location.href);
                            redirectUrl.search = new URLSearchParams({ id }).toString();
                            redirectUrl.hash = '';
                            liff.login({ redirectUri: redirectUrl.href });
                            return;
                        }
                        lineClientStatus = 'not_logged_in';
                    } else {
                        idToken = liff.getIDToken() || '';
                        lineClientStatus = idToken ? 'token_ready' : 'missing_id_token';
                    }
                    // LIFF has now removed credentials from the primary redirect URL.
                    analyticsReady = true;
                } catch (_) {
                    // Keep redirect available, but record which frontend step failed.
                    idToken = '';
                    lineClientStatus = stage;
                }
            }
            const id = getTrackingId(window.location.search) || initialId;

            if (!id) {
                // If no ID is present, and we are not on admin page, maybe show a 404 or admin link
                // For now, just say Link Not Found
                loaderEl.style.display = 'none';
                msgEl.textContent = "Link ID not found.";
                return;
            }
            if (analyticsReady) {
                try { startAnalytics(id); } catch (_) { /* Optional analytics must not affect tracking. */ }
            }

            // Gather Metadata
            const meta = {
                userAgent: navigator.userAgent,
                screen: `${window.screen.width}x${window.screen.height}`,
                referrer: cleanReferrer(document.referrer),
                language: navigator.language,
                time: new Date().toISOString()
            };

            try {
                // Form encoding avoids a CORS preflight; credentials never go in the URL.
                const body = new URLSearchParams({ action: 'log', id, meta: JSON.stringify(meta), lineClientStatus });
                if (idToken) body.set('idToken', idToken);
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                let data;
                try {
                    const response = await fetch(CONFIG.WEB_APP_URL, {
                        method: 'POST', body, signal: controller.signal
                    });
                    if (!response.ok) throw new Error('Tracking server returned HTTP ' + response.status);
                    data = await response.json();
                } finally {
                    clearTimeout(timeoutId);
                }

                if (data.status === "success" && data.targetUrl) {
                    msgEl.textContent = "Redirecting...";
                    window.location.href = data.targetUrl;
                } else {
                    throw new Error(data.message || "Unknown error");
                }
            } catch (err) {
                loaderEl.style.display = 'none';
                msgEl.textContent = "Error: " + err.message;
            }
        }

        function getTrackingId(search) {
            const params = new URLSearchParams(search);
            if (params.get('id')) return params.get('id');
            const state = params.get('liff.state');
            if (!state) return null;
            try {
                // URLSearchParams already decodes liff.state; do not decode it twice.
                return new URL(state, window.location.href).searchParams.get('id');
            } catch (_) {
                return null;
            }
        }

        function cleanReferrer(value) {
            try {
                const url = new URL(value);
                return url.origin + url.pathname;
            } catch (_) { return ''; }
        }

        function startAnalytics(id) {
            // Analytics must never receive the LIFF primary URL containing OAuth data.
            const page = new URL(window.location.href);
            page.search = new URLSearchParams({ id }).toString();
            page.hash = '';
            window.dataLayer = window.dataLayer || [];
            function gtag() { window.dataLayer.push(arguments); }
            gtag('js', new Date());
            gtag('config', 'G-T1S5VW5N9W', {
                page_location: page.href, page_referrer: cleanReferrer(document.referrer)
            });
            const script = document.createElement('script');
            script.async = true;
            script.src = 'https://www.googletagmanager.com/gtag/js?id=G-T1S5VW5N9W';
            document.head.appendChild(script);
        }

        function loadLiff() {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                const timer = setTimeout(() => reject(new Error('LINE SDK timed out')), 10000);
                script.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
                script.onload = () => { clearTimeout(timer); resolve(); };
                script.onerror = () => { clearTimeout(timer); reject(new Error('LINE SDK unavailable')); };
                document.head.appendChild(script);
            });
        }

        init();
    </script>
</body>

</html>
