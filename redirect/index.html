<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f6f8;
            color: #555;
            flex-direction: column;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #message {
            text-align: center;
            max-width: 80%;
        }

        .config-error {
            color: #d9534f;
            background: #f9f2f4;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #d9534f;
        }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T1S5VW5N9W"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-T1S5VW5N9W');
    </script>
</head>

<body>

    <div class="loader" id="loader"></div>
    <div id="message">Processing...</div>

    <script>
        // ==========================================
        // CONFIGURATION SECTION - EDIT THIS!
        // ==========================================
        const CONFIG = {
            // Paste your Google Apps Script Web App URL here
            // Example: "https://script.google.com/macros/s/AKfycby.../exec"
            WEB_APP_URL: "https://script.google.com/macros/s/AKfycbygcvjOD3FDGHUGQAg0uHSmpS7miE39u3kSdLL_Pz_CiRv5EsAmZi6bP5w5E1MzbNVz/exec",
            // LINE Developers > LINE Login channel > LIFF. Leave empty for anonymous tracking.
            LIFF_ID: "2006670422-dTReuVpo"
        };
        // ==========================================

        async function init() {
            let idToken = '';
            if (CONFIG.LIFF_ID && CONFIG.WEB_APP_URL) {
                try {
                    await loadLiff();
                    await liff.init({ liffId: CONFIG.LIFF_ID });
                    // Read the tracking ID only after LIFF restores liff.state.
                    if (!liff.isLoggedIn()) {
                        liff.login({ redirectUri: window.location.href });
                        return;
                    }
                    idToken = liff.getIDToken() || '';
                } catch (_) {
                    // An unavailable LINE session must not prevent the destination opening.
                    idToken = '';
                }
            }
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            const msgEl = document.getElementById('message');
            const loaderEl = document.getElementById('loader');

            if (!CONFIG.WEB_APP_URL) {
                loaderEl.style.display = 'none';
                msgEl.innerHTML = `<div class='config-error'>
                    <strong>System Not Configured</strong><br>
                    Please edit <code>index.html</code> and set the <code>WEB_APP_URL</code> variable.
                </div>`;
                return;
            }

            if (!id) {
                // If no ID is present, and we are not on admin page, maybe show a 404 or admin link
                // For now, just say Link Not Found
                loaderEl.style.display = 'none';
                msgEl.textContent = "Link ID not found.";
                return;
            }

            // Gather Metadata
            const meta = {
                userAgent: navigator.userAgent,
                screen: `${window.screen.width}x${window.screen.height}`,
                referrer: document.referrer,
                language: navigator.language,
                time: new Date().toISOString()
            };

            try {
                // Determine connector (params separator) for GAS URL
                // usually GAS URLs end in /exec. we append ?action=log...
                // Form encoding avoids a CORS preflight; credentials never go in the URL.
                const body = new URLSearchParams({ action: 'log', id, meta: JSON.stringify(meta) });
                if (idToken) body.set('idToken', idToken);
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                let data;
                try {
                    const response = await fetch(CONFIG.WEB_APP_URL, {
                        method: 'POST', body, signal: controller.signal
                    });
                    data = await response.json();
                } finally {
                    clearTimeout(timeoutId);
                }

                if (data.status === "success" && data.targetUrl) {
                    msgEl.textContent = "Redirecting...";
                    window.location.href = data.targetUrl;
                } else {
                    throw new Error(data.message || "Unknown error");
                }
            } catch (err) {
                loaderEl.style.display = 'none';
                msgEl.textContent = "Error: " + err.message;
            }
        }

        function loadLiff() {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                const timer = setTimeout(() => reject(new Error('LINE SDK timed out')), 10000);
                script.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
                script.onload = () => { clearTimeout(timer); resolve(); };
                script.onerror = () => { clearTimeout(timer); reject(new Error('LINE SDK unavailable')); };
                document.head.appendChild(script);
            });
        }

        init();
    </script>
</body>

</html>
