        function populateDistrictOptions() {
            const districtSelect = document.getElementById('district');
            Object.keys(KHONKAEN_GEO).forEach(function(name) {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = 'อำเภอ' + name;
                districtSelect.appendChild(opt);
            });
        }

        function populateSubDistrictOptions(districtName) {
            const subDistrictSelect = document.getElementById('subDistrict');
            subDistrictSelect.innerHTML = '';
            const tambons = KHONKAEN_GEO[districtName] || [];
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.disabled = true;
            placeholder.selected = true;
            placeholder.textContent = tambons.length ? '-- เลือกตำบล --' : '-- เลือกอำเภอก่อน --';
            subDistrictSelect.appendChild(placeholder);
            tambons.forEach(function(name) {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = 'ตำบล' + name;
                subDistrictSelect.appendChild(opt);
            });
            subDistrictSelect.disabled = tambons.length === 0;
        }

        populateDistrictOptions();

        document.getElementById('district').addEventListener('change', function() {
            populateSubDistrictOptions(this.value);
        });


        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${hours}:${minutes}:${seconds}`;
        }

        setInterval(updateTime, 1000);
        updateTime(); 

       
        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

      
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        
        async function initializeLiff() {
            try {
                await liff.init({ liffId: liffId });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    document.getElementById('displayName').textContent = profile.displayName;
                    document.getElementById('statusMessage').textContent = profile.statusMessage;
                    document.getElementById('profileImage').src = profile.pictureUrl;
                    document.getElementById('userStatus').textContent = liff.isLoggedIn() ? 'Online' : 'Offline';
                } else {
                    liff.login();
                }
            } catch (error) {
                console.error('LIFF initialization error:', error);
            }
        }

        initializeLiff();

        
        async function sendToGoogleSheet(userId, firstName, lastName, position, department, district, subDistrict) {
            const response = await fetch('https://script.google.com/macros/s/AKfycbzEra2WSYdWw3NSxgItCcl5BWEIs41ZajR6lPYLx5GqVu0e6l-GGV-z6Eu6fdTseMVt/exec', {  // เปลี่ยนจุดที่ 2 (3.Register)
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    userId: userId,
                    firstName: firstName,
                    lastName: lastName,
                    position: position,
                    department: department,
                    district: district,
                    subDistrict: subDistrict,
                    province: PROVINCE_NAME,
                })
            });

            if (!response.ok) {
                throw new Error('Registration request failed with status ' + response.status);
            }

            return response.json();
        }

        document.getElementById('registrationForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const position = document.getElementById('position').value;
            const positionLabel = document.getElementById('position').selectedOptions[0].text;
            const department = document.getElementById('department').value;
            const district = document.getElementById('district').value;
            const subDistrict = document.getElementById('subDistrict').value;
            const userId = liff.getDecodedIDToken().sub;

            showLoading();

            try {
                await sendToGoogleSheet(userId, firstName, lastName, position, department, district, subDistrict);

                hideLoading();
                document.getElementById('registrationForm').reset();
                document.getElementById('district').selectedIndex = 0;
                populateSubDistrictOptions('');

                await Swal.fire({
                    icon: 'success',
                    title: 'ลงทะเบียนสำเร็จ',
                    text: 'ระบบบันทึกข้อมูลของคุณเรียบร้อยแล้ว',
                    confirmButtonColor: '#2c3e50',
                    timer: 2000,
                    timerProgressBar: true
                });

                try {
                    await sendFlexMessage({ firstName, lastName, positionLabel, department, district, subDistrict });
                } catch (flexError) {
                    // ข้อมูลลงทะเบียนบันทึกสำเร็จไปแล้ว แค่การ์ดสรุปส่งเข้าแชทไม่ได้ (เช่น LIFF ไม่ได้เปิดจากห้องแชท) ไม่ถือเป็น error ร้ายแรง
                    console.error('Error sending confirmation flex message:', flexError);
                }

                liff.closeWindow();
            } catch (error) {
                console.error('Error registering:', error);
                hideLoading();
                await Swal.fire({
                    icon: 'error',
                    title: 'ลงทะเบียนไม่สำเร็จ',
                    text: 'เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้ง',
                    confirmButtonColor: '#8B0000'
                });
            }
        });

        function flexInfoRow(label, value) {
            return {
                type: "box",
                layout: "horizontal",
                spacing: "sm",
                contents: [
                    { type: "text", text: label, size: "sm", color: "#8b93a1", flex: 2 },
                    { type: "text", text: value, size: "sm", color: "#1a1a1a", weight: "bold", wrap: true, flex: 3 }
                ]
            };
        }

        async function sendFlexMessage({ firstName, lastName, positionLabel, department, district, subDistrict }) {
            const now = new Date();
            const time = now.toLocaleTimeString('en-GB', { hour12: false });
            const profile = await liff.getProfile();
